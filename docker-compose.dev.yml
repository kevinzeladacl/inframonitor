services:
  mongodb:
    image: mongo:7.0
    container_name: INFRAMONITOR-MONGODB
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27117}:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-inframonitor_dev}
    volumes:
      - inframonitor_mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  inframonitor_mongodb_data:
    name: inframonitor_mongodb_data
    driver: local
